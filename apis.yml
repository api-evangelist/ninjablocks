aid: ninjablocks
name: NinjaBlocks
description: >-
  Ninja Blocks Inc was an Australian Internet-of-Things startup (founded 2012,
  backed by 500 Global / 500 Startups) behind the Ninja Block and Ninja Sphere
  home-automation hubs. It offered a cloud-connected platform with a RESTful API
  (base https://api.ninja.is/rest/v0/) for reading sensor data and controlling
  actuators, plus first-party client libraries for Node.js, PHP, Ruby, Lua and
  Arduino, a `ninja-toolbelt` CLI, and OAuth-based authentication. The company
  ceased operation and its web and API hosts are no longer online; this profile
  preserves the surviving first-party open-source client libraries and API
  tooling published to npm and GitHub. Added to the API Evangelist network from
  the 500 Global portfolio and enriched from public package registries and the
  github.com/ninjablocks organization.
